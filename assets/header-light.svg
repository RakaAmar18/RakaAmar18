<svg width="100%" height="auto" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="accent-cyan-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="glow-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.08"/>
      <stop offset="40%" stop-color="#3B82F6" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E2E8F0" stroke-width="0.75"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .pill { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
    .name { font-size: 32px; font-weight: 800; letter-spacing: -0.025em; }
    .handle { font-size: 18px; font-weight: 500; letter-spacing: -0.01em; }
    .title { font-size: 14.5px; font-weight: 400; line-height: 22px; }
    .chip { font-size: 11.5px; font-weight: 500; }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#bg-light)" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#grid-light)" opacity="0.8"/>
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#glow-light)"/>

  <!-- Top Accent Bar -->
  <rect x="2" y="2" width="896" height="3" rx="1.5" fill="url(#accent-cyan-light)"/>

  <!-- Status / Eyebrow Pill -->
  <g transform="translate(36, 28)">
    <rect width="286" height="26" rx="13" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#0284C7"/>
    <circle cx="14" cy="13" r="7" stroke="#0284C7" stroke-width="1" stroke-opacity="0.3"/>
    <text x="26" y="17" class="mono pill" fill="#0369A1">FRONTEND &amp; MOBILE APP BUILDER</text>
  </g>

  <!-- Location Badge -->
  <g transform="translate(738, 28)">
    <rect width="126" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="14" cy="13" r="3.5" fill="#059669"/>
    <text x="26" y="17" class="sans pill" fill="#475569" letter-spacing="0.04em">JAKARTA, ID</text>
  </g>

  <!-- Name Headline & Studio Tag -->
  <text x="36" y="100" class="sans name" fill="#0F172A">Raka Amar Taru Lintang</text>
  <text x="432" y="100" class="sans handle" fill="#64748B">· CodeByRakaStudio</text>

  <!-- Descriptive Subtitle -->
  <text x="36" y="128" class="sans title" fill="#334155">
    Engineering clean interfaces, resilient offline-first mobile apps, and refined digital experiences.
  </text>
  <text x="36" y="150" class="sans title" fill="#475569">
    Specialized in React Native · Expo · TypeScript · Modern Web Design · Interactive Systems
  </text>

  <!-- Tech Focus Chips -->
  <g transform="translate(36, 178)">
    <!-- Chip 1: React Native & Expo -->
    <g transform="translate(0, 0)">
      <rect width="150" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="14" cy="14" r="3" fill="#0284C7"/>
      <text x="24" y="18" class="sans chip" fill="#1E293B">React Native &amp; Expo</text>
    </g>

    <!-- Chip 2: TypeScript -->
    <g transform="translate(158, 0)">
      <rect width="98" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="14" cy="14" r="3" fill="#2563EB"/>
      <text x="24" y="18" class="sans chip" fill="#1E293B">TypeScript</text>
    </g>

    <!-- Chip 3: UI/UX & Design Systems -->
    <g transform="translate(264, 0)">
      <rect width="176" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="14" cy="14" r="3" fill="#9333EA"/>
      <text x="24" y="18" class="sans chip" fill="#1E293B">UI/UX &amp; Design Systems</text>
    </g>

    <!-- Chip 4: Offline-First -->
    <g transform="translate(448, 0)">
      <rect width="138" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="14" cy="14" r="3" fill="#059669"/>
      <text x="24" y="18" class="sans chip" fill="#1E293B">Offline-First Apps</text>
    </g>

    <!-- Chip 5: Python Systems -->
    <g transform="translate(594, 0)">
      <rect width="124" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="14" cy="14" r="3" fill="#D97706"/>
      <text x="24" y="18" class="sans chip" fill="#1E293B">Python Systems</text>
    </g>

    <!-- Portfolio link chip -->
    <g transform="translate(726, 0)">
      <rect width="138" height="28" rx="6" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
      <circle cx="14" cy="14" r="3" fill="#0284C7"/>
      <text x="24" y="18" class="mono chip" font-weight="600" fill="#0369A1">rakaamar.site ↗</text>
    </g>
  </g>
</svg>
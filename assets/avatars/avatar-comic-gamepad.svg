<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="halftone-yellow-3" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="4" fill="#FFE600" fill-opacity="0.35"/>
    </pattern>
    <clipPath id="circle-clip-3">
      <circle cx="512" cy="512" r="472"/>
    </clipPath>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bangers&amp;family=Comic+Neue:wght@700&amp;display=swap');
    .title-font { font-family: 'Bangers', Impact, 'Arial Black', sans-serif; }
    .mono-font { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 800; }
  </style>

  <!-- Ground Shadow -->
  <circle cx="524" cy="524" r="480" fill="#0F172A"/>

  <!-- Main Background: Vibrant Electric Cyan -->
  <circle cx="512" cy="512" r="480" fill="#00E5FF" stroke="#0F172A" stroke-width="24"/>

  <g clip-path="url(#circle-clip-3)">
    <!-- Yellow Halftone Pattern -->
    <rect x="32" y="32" width="960" height="960" fill="url(#halftone-yellow-3)"/>

    <!-- Comic Action Burst Behind Gamepad -->
    <g transform="translate(512, 490) scale(1.15)">
      <path d="M 0 -260 L 70 -150 L 220 -220 L 160 -90 L 290 -50 L 170 60 L 270 170 L 120 150 L 130 280 L 0 190 L -130 280 L -120 150 L -270 170 L -170 60 L -290 -50 L -160 -90 L -220 -220 L -70 -150 Z"
            fill="#0F172A" transform="translate(16, 16)"/>
      <path d="M 0 -260 L 70 -150 L 220 -220 L 160 -90 L 290 -50 L 170 60 L 270 170 L 120 150 L 130 280 L 0 190 L -130 280 L -120 150 L -270 170 L -170 60 L -290 -50 L -160 -90 L -220 -220 L -70 -150 Z"
            fill="#FFE600" stroke="#0F172A" stroke-width="16"/>
    </g>

    <!-- Retro Comic Gamepad Body -->
    <g transform="translate(512, 480)">
      <!-- Gamepad Shadow -->
      <rect x="-260" y="-160" width="520" height="320" rx="90" fill="#0F172A" transform="translate(16, 16)"/>
      <!-- Gamepad Main Shell (Warm Paper / Cream) -->
      <rect x="-260" y="-160" width="520" height="320" rx="90" fill="#FFFDF0" stroke="#0F172A" stroke-width="18"/>

      <!-- Center LCD / Badge Screen -->
      <rect x="-90" y="-115" width="180" height="130" rx="18" fill="#0F172A" transform="translate(8, 8)"/>
      <rect x="-90" y="-115" width="180" height="130" rx="18" fill="#0F172A" stroke="#0F172A" stroke-width="8"/>
      <rect x="-82" y="-107" width="164" height="114" rx="14" fill="#00E5FF"/>
      <!-- Pixel Text in Screen -->
      <text x="0" y="-30" class="title-font" font-size="52" fill="#0F172A" text-anchor="middle">RAKA</text>
      <text x="0" y="-2" class="mono-font" font-size="16" fill="#0F172A" text-anchor="middle">&lt;DEV/&gt;</text>

      <!-- D-PAD on Left -->
      <g transform="translate(-155, 30)">
        <!-- D-Pad Shadow -->
        <rect x="-55" y="-18" width="110" height="36" rx="6" fill="#0F172A" transform="translate(6, 6)"/>
        <rect x="-18" y="-55" width="36" height="110" rx="6" fill="#0F172A" transform="translate(6, 6)"/>
        <!-- D-Pad Body in Comic Yellow -->
        <rect x="-55" y="-18" width="110" height="36" rx="6" fill="#FFE600" stroke="#0F172A" stroke-width="8"/>
        <rect x="-18" y="-55" width="36" height="110" rx="6" fill="#FFE600" stroke="#0F172A" stroke-width="8"/>
        <!-- Center circle -->
        <circle cx="0" cy="0" r="10" fill="#0F172A"/>
      </g>

      <!-- Action Buttons on Right -->
      <g transform="translate(155, 30)">
        <!-- Button B -->
        <circle cx="-35" cy="20" r="30" fill="#0F172A" transform="translate(6, 6)"/>
        <circle cx="-35" cy="20" r="30" fill="#FF3D71" stroke="#0F172A" stroke-width="8"/>
        <text x="-35" y="32" class="title-font" font-size="34" fill="#FFFFFF" text-anchor="middle">B</text>

        <!-- Button A -->
        <circle cx="35" cy="-20" r="30" fill="#0F172A" transform="translate(6, 6)"/>
        <circle cx="35" cy="-20" r="30" fill="#FF3D71" stroke="#0F172A" stroke-width="8"/>
        <text x="35" y="-8" class="title-font" font-size="34" fill="#FFFFFF" text-anchor="middle">A</text>
      </g>

      <!-- Bottom Select / Start Pill Buttons -->
      <g transform="translate(0, 90)">
        <rect x="-55" y="-8" width="45" height="16" rx="8" fill="#0F172A" transform="rotate(-15)"/>
        <rect x="15" y="-8" width="45" height="16" rx="8" fill="#0F172A" transform="rotate(-15)"/>
      </g>
    </g>

    <!-- Bottom Studio Label Pill -->
    <g transform="translate(512, 790)">
      <rect x="-180" y="-30" width="360" height="60" rx="30" fill="#0F172A" transform="translate(8, 8)"/>
      <rect x="-180" y="-30" width="360" height="60" rx="30" fill="#FFE600" stroke="#0F172A" stroke-width="10"/>
      <text x="0" y="11" class="title-font" font-size="32" fill="#0F172A" text-anchor="middle">GAME BUILDER</text>
    </g>
  </g>

  <!-- Final Outer Inking Circle -->
  <circle cx="512" cy="512" r="480" fill="none" stroke="#0F172A" stroke-width="24"/>
</svg>
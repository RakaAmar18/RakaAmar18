<svg width="100%" height="auto" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="50%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#080C16"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="glow-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid-dark" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .pill { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
    .name { font-size: 32px; font-weight: 800; letter-spacing: -0.025em; }
    .handle { font-size: 18px; font-weight: 500; letter-spacing: -0.01em; }
    .title { font-size: 14.5px; font-weight: 400; line-height: 22px; }
    .chip { font-size: 11.5px; font-weight: 500; }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#bg-dark)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#grid-dark)" opacity="0.8"/>
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#glow-dark)"/>

  <!-- Top Accent Bar -->
  <rect x="2" y="2" width="896" height="3" rx="1.5" fill="url(#accent-cyan)"/>

  <!-- Status / Eyebrow Pill -->
  <g transform="translate(36, 28)">
    <rect width="286" height="26" rx="13" fill="#082F49" stroke="#0284C7" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="14" cy="13" r="4" fill="#06B6D4"/>
    <circle cx="14" cy="13" r="7" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.4"/>
    <text x="26" y="17" class="mono pill" fill="#38BDF8">FRONTEND &amp; MOBILE APP BUILDER</text>
  </g>

  <!-- Location Badge -->
  <g transform="translate(738, 28)">
    <rect width="126" height="26" rx="13" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="14" cy="13" r="3.5" fill="#10B981"/>
    <text x="26" y="17" class="sans pill" fill="#94A3B8" letter-spacing="0.04em">JAKARTA, ID</text>
  </g>

  <!-- Name Headline & Studio Tag -->
  <text x="36" y="100" class="sans name" fill="#F8FAFC">Raka Amar Taru Lintang</text>
  <text x="432" y="100" class="sans handle" fill="#64748B">· CodeByRakaStudio</text>

  <!-- Descriptive Subtitle -->
  <text x="36" y="128" class="sans title" fill="#CBD5E1">
    Engineering clean interfaces, resilient offline-first mobile apps, and refined digital experiences.
  </text>
  <text x="36" y="150" class="sans title" fill="#94A3B8">
    Specialized in React Native · Expo · TypeScript · Modern Web Design · Interactive Systems
  </text>

  <!-- Tech Focus Chips -->
  <g transform="translate(36, 178)">
    <!-- Chip 1: React Native & Expo -->
    <g transform="translate(0, 0)">
      <rect width="150" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="14" r="3" fill="#06B6D4"/>
      <text x="24" y="18" class="sans chip" fill="#E2E8F0">React Native &amp; Expo</text>
    </g>

    <!-- Chip 2: TypeScript -->
    <g transform="translate(158, 0)">
      <rect width="98" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="14" r="3" fill="#3B82F6"/>
      <text x="24" y="18" class="sans chip" fill="#E2E8F0">TypeScript</text>
    </g>

    <!-- Chip 3: UI/UX & Design Systems -->
    <g transform="translate(264, 0)">
      <rect width="176" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="14" r="3" fill="#A855F7"/>
      <text x="24" y="18" class="sans chip" fill="#E2E8F0">UI/UX &amp; Design Systems</text>
    </g>

    <!-- Chip 4: Offline-First -->
    <g transform="translate(448, 0)">
      <rect width="138" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="14" r="3" fill="#10B981"/>
      <text x="24" y="18" class="sans chip" fill="#E2E8F0">Offline-First Apps</text>
    </g>

    <!-- Chip 5: Python Systems -->
    <g transform="translate(594, 0)">
      <rect width="124" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="14" r="3" fill="#F59E0B"/>
      <text x="24" y="18" class="sans chip" fill="#E2E8F0">Python Systems</text>
    </g>

    <!-- Portfolio link chip -->
    <g transform="translate(726, 0)">
      <rect width="138" height="28" rx="6" fill="#082F49" stroke="#0284C7" stroke-width="1"/>
      <circle cx="14" cy="14" r="3" fill="#38BDF8"/>
      <text x="24" y="18" class="mono chip" font-weight="600" fill="#38BDF8">rakaamar.site ↗</text>
    </g>
  </g>
</svg>